name: cliff-change-detection
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.9,<3.13

  # Core Geospatial & Point Cloud Libraries
  - pdal>=2.9
  - python-pdal>=3.5
  - laspy>=2.6
  - lazrs-python
  - geopandas>=1.1
  - shapely>=2.1
  - pyproj>=3.7

  # Math & Data Analysis
  - numpy>=2.4
  - pandas>=2.3
  - scipy>=1.16
  - scikit-learn>=1.8

  # Visualization
  - matplotlib>=3.10
  - seaborn>=0.13

  # Utilities
  - tqdm>=4.67
  - joblib>=1.5
  - pytest>=8.0

  # Pip fallback (if any packages are missing from conda-forge)
  - pip
  - pip:
    - alphashape>=1.3
