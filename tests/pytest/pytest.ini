[pytest]
# Pytest configuration for cliff-change-detection pipeline tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = .

# Minimum version
minversion = 6.0

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Markers for categorizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests requiring external dependencies
    unit: marks tests as unit tests
    requires_pdal: marks tests requiring PDAL installation
    requires_cloudcompare: marks tests requiring CloudCompare installation

# Coverage options (if using pytest-cov)
# Uncomment to enable coverage reporting
# addopts = --cov=../pipeline --cov-report=html --cov-report=term

# Ignore warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning
